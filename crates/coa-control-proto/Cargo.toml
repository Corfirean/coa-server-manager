[package]
name = "coa-control-proto"
description = "Player <-> Host control protocol (Phase 12): coordinator framing, the end-to-end Noise channel, identity binding and the application messages. No I/O."
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[dependencies]
coa-registry-proto = { path = "../coa-registry-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = "2"
snow = "0.9"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4", "v7"] }
