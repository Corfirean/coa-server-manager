[package]
name = "coa-relay"
description = "CoA Game Relay (Phase 13): relays game TCP traffic (AUTH & WORLD) for NAT/CGNAT hosts."
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[workspace]

[dependencies]
coa-control-proto = { path = "../../crates/coa-control-proto" }
coa-registry-proto = { path = "../../crates/coa-registry-proto" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net", "sync", "io-util"] }
tower = { version = "0.5", features = ["limit", "util"] }
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
hex = "0.4"
base64 = "0.22"
futures-util = "0.3"
rand = "0.8"


[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.26"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
