[package]
name = "coa-registry-e2e"
description = "End-to-end tests: the Host Manager's publishing lifecycle (coa-core) against the real Registry service code. Test-only; separate from the service so that its image build never needs coa-core."
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]

[dev-dependencies]
coa-core = { path = "../../crates/coa-core" }
coa-registry = { path = "../coa-registry" }
coa-registry-proto = { path = "../../crates/coa-registry-proto" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
ed25519-dalek = "2"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
tempfile = "3"
