[package]
name = "coa-registry"
description = "CoA realm Registry service (Phase 10): discovery and presence only. Standalone; not part of the Manager workspace."
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[workspace]

[dependencies]
coa-registry-proto = { path = "../../crates/coa-registry-proto" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net", "sync"] }
tower = { version = "0.5", features = ["limit", "util"] }
tower-http = { version = "0.6", features = ["timeout"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
deadpool-postgres = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
thiserror = "2"
hex = "0.4"
pin-project-lite = "0.2"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
